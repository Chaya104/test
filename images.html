<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Images</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="imagesStyle.css">
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="brand">ChatGPT <span class="arrow">˅</span></a>
        </div>

        <nav class="nav-center">
            <a href="index.html">Main</a>
            <a href="images.html">Images</a>
            <a href="agent.html">Agent</a>
        </nav>

        <div class="nav-right">
            <a href="#" class="btn-text">Log in</a>
            <a href="#" class="btn-pill">Sign up for free</a>
            <button type="button" class="btn-help" title="Help / Request info">?</button>
        </div>
    </header>

    <main class="page-container">
        
        <h1 class="main-title">Images</h1>

        <section class="gallery-section">
            <div class="section-header">
                <h2 class="section-title">Try a style on an image</h2>
                <div class="nav-arrows">
                    <button type="button" class="arrow-btn" aria-label="Previous">&lsaquo;</button>
                    <button type="button" class="arrow-btn" aria-label="Next">&rsaquo;</button>
                </div>
            </div>
            
            <div class="cards-row">
                <figure class="style-card">
                    <img src="images/תמונה 1.jpg" alt="תמונה אחת">
                    <figcaption>Sketch</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/תמונה 2.jpg" alt="תמונה 2">
                    <figcaption>Dramatic</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/תמונה 3.jpg" alt="תמונה 3">
                    <figcaption>Plushie</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/תמונה 4.jpg" alt="תמונה 4">
                    <figcaption>Retro anime</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/תמונה 5.jpg" alt="תמונה 5">
                    <figcaption>Baseball bobblehead</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/תמונה 6.jpg" alt="תמונה 6">
                    <figcaption>Doodle</figcaption>
                </figure>
            </div>
        </section>

        <section class="discover-section">
            <div class="section-header">
                <h2 class="section-title">Discover something new</h2>
                <div class="nav-arrows">
                    <button type="button" class="arrow-btn" aria-label="Previous">&lsaquo;</button>
                    <button type="button" class="arrow-btn" aria-label="Next">&rsaquo;</button>
                </div>
            </div>
            
            <div class="discover-row">
                <div class="column-half">
                    <div class="mini-card">
                        <img src="images/תמונה 7.jpg" alt="The Girl with a Pearl">
                        <span class="card-text">תמונה 7</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/תמונה 8.jpg" alt="Remove people in background">
                        <span class="card-text">תמונה 8</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/תמונה 9.jpg" alt="K-Pop star look">
                        <span class="card-text">תמונה 9?</span>
                    </div>
                </div>
                <div class="column-half">
                    <div class="mini-card">
                        <img src="images/תמונה 10.jpg" alt="Product photo burger">
                        <span class="card-text">תמונה 10</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/תמונה 11.jpg" alt="Style me portrait">
                        <span class="card-text">תמונה 11</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/תמונה 12.jpg" alt="Keychain toy">
                        <span class="card-text">תמונה 12</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
