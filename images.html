<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Images</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="imagesStyle.css">
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="brand">ChatGPT <span class="arrow">˅</span></a>
        </div>

        <nav class="nav-center">
            <a href="index.html">Main</a>
            <a href="images.html">Images</a>
            <a href="agent.html">Agent</a>
        </nav>

        <div class="nav-right">
            <a href="#" class="btn-text">Log in</a>
            <a href="#" class="btn-pill">Sign up for free</a>
            <button type="button" class="btn-help" title="Help / Request info">?</button>
        </div>
    </header>

    <main class="page-container">
        
        <h1 class="main-title">Images</h1>

        <section class="gallery-section">
            <div class="section-header">
                <h2 class="section-title">Try a style on an image</h2>
                <div class="nav-arrows">
                    <button type="button" class="arrow-btn" aria-label="Previous">&lsaquo;</button>
                    <button type="button" class="arrow-btn" aria-label="Next">&rsaquo;</button>
                </div>
            </div>
            
            <div class="cards-row">
                <figure class="style-card">
                    <img src="images/img1.jpg" alt="Sketch style">
                    <figcaption>Sketch</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/img2.jpg" alt="Dramatic style">
                    <figcaption>Dramatic</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/img3.jpg" alt="Plushie style">
                    <figcaption>Plushie</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/img4.jpg" alt="Retro anime style">
                    <figcaption>Retro anime</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/img5.jpg" alt="Baseball bobblehead style">
                    <figcaption>Baseball bobblehead</figcaption>
                </figure><!--
             --><figure class="style-card">
                    <img src="images/img6.jpg" alt="Doodle style">
                    <figcaption>Doodle</figcaption>
                </figure>
            </div>
        </section>

        <section class="discover-section">
            <div class="section-header">
                <h2 class="section-title">Discover something new</h2>
                <div class="nav-arrows">
                    <button type="button" class="arrow-btn" aria-label="Previous">&lsaquo;</button>
                    <button type="button" class="arrow-btn" aria-label="Next">&rsaquo;</button>
                </div>
            </div>
            
            <div class="discover-row">
                <div class="column-half">
                    <div class="mini-card">
                        <img src="images/img7.jpg" alt="The Girl with a Pearl">
                        <span class="card-text">Me as The Girl with a Pearl</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/img8.jpg" alt="Remove people in background">
                        <span class="card-text">Remove people in the background</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/img9.jpg" alt="K-Pop star look">
                        <span class="card-text">What would I look like as a K-Pop star?</span>
                    </div>
                </div>
                <div class="column-half">
                    <div class="mini-card">
                        <img src="images/img10.jpg" alt="Product photo burger">
                        <span class="card-text">Create a professional product photo</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/img11.jpg" alt="Style me portrait">
                        <span class="card-text">Style me</span>
                    </div>
                    <div class="mini-card">
                        <img src="images/img12.jpg" alt="Keychain toy">
                        <span class="card-text">Turn into a keychain</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
