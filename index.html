<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Main</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="indexStyle.css">
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="brand">ChatGPT</a>
        </div>

        <nav class="nav-center">
            <a href="index.html">About</a>
            <a href="#">Features</a>
            <a href="#">Learn</a>
            <a href="#">Business</a>
            <a href="#">Pricing</a>
            <a href="images.html">Images</a>
            <a href="agent.html">Agent</a>
            <a href="#">Download</a>
        </nav>

        <div class="nav-right">
            <a href="#" class="btn-text">Log in</a>
            <a href="#" class="btn-pill">Sign up for free</a>
            <button type="button" class="btn-help">Help</button>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="prompt-section">
            <h1 class="main-heading">What's on the agenda today?</h1>

            <form class="prompt-box" action="#" method="get">
                <input 
                    type="text" 
                    class="prompt-input" 
                    placeholder="Ask anything..." 
                    aria-label="Ask anything"
                >

                <div class="prompt-actions">
                    <button type="button" class="action-btn">Attach</button>
                    <button type="button" class="action-btn">Search</button>
                    <button type="button" class="action-btn">Study</button>
                    <button type="button" class="action-btn">Create image</button>

                    <button type="button" class="action-btn voice-btn">Voice</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
